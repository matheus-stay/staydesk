# Textos do backend que o núcleo escreve com "Chatwoot". O Rails mescla este arquivo
# por cima de config/locales/pt_BR.yml (mesmas chaves). Conferido por custom/bin/marca.mjs.
pt_BR:
  integration_apps:
    dyte:
      short_description: Iniciar chamadas de vídeo/voz com clientes diretamente do StayDesk.
      description: O Cloudflare RealtimeKit permite que seus atendentes iniciem chamadas de vídeo e voz com seus clientes diretamente pelo StayDesk.
    slack:
      description: Integre o StayDesk com o Slack para manter seu time em sincronia. Essa integração permite que você receba notificações de novas conversas e as responda diretamente na interface do Slack.
    webhooks:
      description: Eventos webhook fornecem atualizações sobre atividades em tempo real na sua conta StayDesk. Você pode se inscrever em seus eventos preferidos, e o StayDesk enviará as chamadas HTTP com
        as atualizações.
  staydesk:
    ticket_fields:
      required_to_resolve: 'Preencha antes de resolver: %{fields}'
    email:
      attachments: Anexos
      footer:
        reply_here: Responda este e-mail para continuar a conversa.
      csat:
        title: Como foi o nosso atendimento?
        subtitle: Sua resposta leva menos de um minuto e ajuda a gente a melhorar.
        button: Avaliar atendimento
        hint: Escolha uma carinha ou clique no botão para abrir a pesquisa.
        faces:
          '1': 😞
          '2': 🙁
          '3': 😐
          '4': 🙂
          '5': 😍
      recebimento:
        titulo: Dados do chamado
        numero: Número
        assunto: Assunto
        canal: Canal
        aberto_em: Aberto em
        botao: Acompanhar no painel
        dica: Você também pode responder este e-mail.
  conversations:
    reply:
      email:
        header:
          friendly_name: '%{sender_name} da %{business_name} <%{from_email}>'
