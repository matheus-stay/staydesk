openapi: '3.1.0'
info:
  title: StayDesk — API própria
  description: Rotas que a camada StayDesk acrescenta ao Chatwoot, sob /api/v1/accounts/{account_id}/staydesk/. Mesma autenticação da API do Chatwoot (api_access_token do usuário ou do usuário-serviço).
  version: 0.1.0
paths:
  /api/v1/accounts/{account_id}/staydesk/ping:
    get:
      summary: Versão do fork e do upstream
      responses:
        '200':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/workspace:
    get:
      summary: Área de trabalho resolvida para quem chama (menu, lista, campos, seções, apps, macros, caixa de resposta, papel, times)
      responses:
        '200':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/team_workspaces:
    get:
      summary: Configurações por time (administrador)
      responses:
        '200':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/team_workspaces/{team_id}:
    get:
      summary: Configuração de um time; `default` é o padrão da conta
      responses:
        '200':
          description: ok
    put:
      summary: Grava a configuração ({ config }), validada pelo JSON Schema em custom/config/schemas/team_workspace.json
      responses:
        '200':
          description: ok
        '422':
          description: fora do esquema
  /api/v1/accounts/{account_id}/staydesk/team_workspaces/schema:
    get:
      summary: O JSON Schema da configuração
      responses:
        '200':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/team_views:
    get:
      summary: Views visíveis ao usuário (administrador vê todas)
      responses:
        '200':
          description: ok
    post:
      summary: Cria uma view (administrador); corpo em team_view
      responses:
        '200':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/team_views/{id}:
    patch:
      summary: Atualiza (administrador)
      responses:
        '200':
          description: ok
    delete:
      summary: Remove (administrador)
      responses:
        '204':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/team_views/{id}/conversations:
    get:
      summary: Conversas da view, mesma resposta de POST /conversations/filter; parâmetro page
      responses:
        '200':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/team_views/counts:
    get:
      summary: Contagem por view visível ao usuário; cache de 30 s
      responses:
        '200':
          description: '{ counts: { id: n } }'
  /api/v1/accounts/{account_id}/staydesk/agent_roles:
    get:
      summary: Papel StayDesk (full ou light) por agente (administrador)
      responses:
        '200':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/agent_roles/{user_id}:
    put:
      summary: Define o papel ({ kind })
      responses:
        '200':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/events:
    get:
      summary: Eventos de tempo (reporting_events) e de mudança (status, responsável, time, prioridade) por conversa (administrador)
      parameters:
        - in: query
          name: since
          schema: { type: string, format: date-time }
        - in: query
          name: until
          schema: { type: string, format: date-time }
        - in: query
          name: conversation_id
          description: display_id da conversa
          schema: { type: integer }
        - in: query
          name: kind
          description: nome do reporting_event ou tipo do evento de mudança
          schema: { type: string }
        - in: query
          name: after_reporting_id
          schema: { type: integer }
        - in: query
          name: after_event_id
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer, maximum: 500 }
      responses:
        '200':
          description: '{ reporting_events: [...], conversation_events: [...] }, cada lista em ordem de id'
  /api/v1/accounts/{account_id}/staydesk/calendars:
    get:
      summary: Calendários de atendimento do SLA (horário semanal e feriados)
      responses:
        '200':
          description: ok
    post:
      summary: Cria um calendário (administrador)
      responses:
        '200':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/sla_policies:
    get:
      summary: Políticas de SLA da conta, na ordem de avaliação
      responses:
        '200':
          description: ok
    post:
      summary: Cria uma política (administrador)
      responses:
        '200':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/sla_policies/reorder:
    put:
      summary: Reordena as políticas ({ ids }, administrador)
      responses:
        '200':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/applied_slas:
    get:
      summary: SLAs aplicados, para o dashboard consumir (filtros de status e período)
      responses:
        '200':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/conversations/{conversation_id}/sla:
    get:
      summary: SLA da conversa (política, alvos, vencimentos e status)
      responses:
        '200':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/agent_statuses:
    get:
      summary: 'Catálogo de status do agente e o status atual de quem chama: { statuses, current_status_id }'
      responses:
        '200':
          description: ok
    post:
      summary: Cria um status (administrador); aceita capacity ({ chat, ticket })
      responses:
        '200':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/agent_status_periods:
    get:
      summary: Períodos de status por agente, para o dashboard somar por dia (administrador)
      parameters:
        - in: query
          name: user_id
          schema: { type: integer }
      responses:
        '200':
          description: ok
    post:
      summary: Troca o status de quem chama ({ agent_status_id })
      responses:
        '200':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/agent_loads:
    get:
      summary: Carga simultânea por agente e por fila, contra o limite do status atual (administrador)
      responses:
        '200':
          description: 'lista de { user_id, name, status, load: { chat, ticket }, capacity: { chat, ticket } }; limite nulo é sem limite'
  /api/v1/accounts/{account_id}/staydesk/ticket_statuses:
    get:
      summary: Catálogo de status do ticket, na ordem de exibição
      responses:
        '200':
          description: ok
    post:
      summary: Cria um status (administrador); base_status é um dos quatro do Chatwoot
      responses:
        '200':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/ticket_statuses/reorder:
    put:
      summary: Reordena o catálogo ({ ids }, administrador)
      responses:
        '200':
          description: ok
  /api/v1/accounts/{account_id}/staydesk/conversations/{conversation_id}/ticket_status:
    post:
      summary: Aplica um status personalizado à conversa ({ ticket_status_id, snoozed_until })
      responses:
        '200':
          description: a conversa no formato padrão da API
